name: Binary Build

on:
  workflow_dispatch:
  push:
    branches:
      - Asli
    tags:
      - "is.*"
      - "v*"
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published
      - prereleased

permissions:
  contents: write

jobs:
  verify:
    name: Verify configuration and installers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Environment naming guard
        run: go test ./internal/platform/envguard/

      - name: Validate installer shell scripts
        shell: bash
        run: bash -n scripts/gamaj/gamaj-node.sh scripts/tests/e2e-node-install.sh

  # Extra VPN assets (AmneziaWG, the SSTP/PPTP accel-ppp bundle) are built on
  # native runners: ubuntu-latest for amd64 and the public ARM runner for arm64.
  # No container runtime or emulation is involved.
  build-extra-vpn-assets:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            alpine_arch: x86_64
            loader_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine_arch: aarch64
            loader_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: amneziawg-go

      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: amneziawg-tools

      - name: Install native musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools linux-libc-dev build-essential
          # musl-gcc compiles with -nostdinc against the musl include tree only,
          # so the kernel headers from linux-libc-dev are invisible to it. The
          # AmneziaWG C sources include <linux/*.h>; expose them after musl's
          # own headers for every musl include tree present on the runner.
          for musl_inc in /usr/include/*-linux-musl; do
            [ -d "$musl_inc" ] || continue
            gnu_inc="/usr/include/$(basename "$musl_inc" | sed 's/-musl$/-gnu/')"
            sudo rm -rf "$musl_inc/linux" "$musl_inc/asm" "$musl_inc/asm-generic"
            sudo cp -r /usr/include/linux "$musl_inc/linux"
            if [ -d "$gnu_inc/asm" ]; then
              sudo cp -r "$gnu_inc/asm" "$musl_inc/asm"
            fi
            if [ -d /usr/include/asm-generic ]; then
              sudo cp -r /usr/include/asm-generic "$musl_inc/asm-generic"
            fi
          done

      - name: Build AmneziaWG Go runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd amneziawg-go
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/gamaj-amneziawg-go-linux-${{ matrix.arch }}" .

      - name: Build AmneziaWG tools runtime (static musl)
        shell: bash
        run: |
          set -euo pipefail
          cd amneziawg-tools/src
          make CC=musl-gcc WITH_WGQUICK=no WITH_BASHCOMPLETION=no WITH_SYSTEMDUNITS=no LDFLAGS=-static
          cp wg "$GITHUB_WORKSPACE/dist/gamaj-amneziawg-tools-linux-${{ matrix.arch }}"

      # The accel-ppp bundle keeps the exact Alpine recipe (apk packages, musl
      # loader, copied dependencies) but runs it in an extracted Alpine rootfs
      # instead of a container.
      - name: Build accel-ppp bundle (Alpine chroot)
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.arch }}
          ARCH: ${{ matrix.loader_arch }}
        run: |
          set -euo pipefail
          alpine_arch="${{ matrix.alpine_arch }}"
          rootfs="$RUNNER_TEMP/alpine-rootfs"
          mkdir -p "$rootfs"
          base="https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/${alpine_arch}"
          tarball="$(curl -fsSL "$base/" | grep -oE "alpine-minirootfs-[0-9.]+-${alpine_arch}\\.tar\\.gz" | sort -V | tail -n1)"
          test -n "$tarball"
          curl -fsSL "$base/$tarball" | sudo tar -xz -C "$rootfs"
          sudo cp /etc/resolv.conf "$rootfs/etc/resolv.conf"
          sudo mkdir -p "$rootfs/proc"
          sudo mount --bind /proc "$rootfs/proc"
          sudo cp tools/build-accel-bundle.sh "$rootfs/build-accel-bundle.sh"
          sudo chroot "$rootfs" /bin/sh -c "ASSET_ARCH=$ASSET_ARCH ARCH=$ARCH /bin/sh /build-accel-bundle.sh"
          sudo umount "$rootfs/proc"
          cp "$rootfs/out/gamaj-accel-ppp-linux-${{ matrix.arch }}.tar.gz" dist/
          tar -tzf "dist/gamaj-accel-ppp-linux-${{ matrix.arch }}.tar.gz" | grep 'usr/libexec/gamaj-accel/sbin/accel-pppd' >/dev/null

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/gamaj-*-linux-${{ matrix.arch }}*; do
            [[ "$file" == *.sha256 ]] || sha256sum "$file" > "${file}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gamaj-extra-vpn-linux-${{ matrix.arch }}
          path: dist/gamaj-*

  # Pinned telemt (MTProto proxy) asset, built natively per architecture with a
  # static musl target, so no container runtime or emulation is involved.
  build-patched-telemt:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      # Upstream MTProto proxy implementation. The Gamaj patches (user_modes,
      # socks_user_from_account, hot-reload mode merging) are asserted below so a
      # changed upstream cannot silently ship without them.
      - name: Checkout patched telemt
        uses: actions/checkout@v4
        with:
          repository: Sir-MmD/telemt
          ref: 1e6549df23136a676ef8ec36ef0f1d9af2a1083d
          path: telemt

      - name: Install native Rust musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential musl-tools pkgconf cmake perl
          # Same kernel-header exposure as the extra-vpn job: musl-gcc does not
          # search /usr/include, and C dependencies compiled through the cc
          # crate may include <linux/*.h>.
          for musl_inc in /usr/include/*-linux-musl; do
            [ -d "$musl_inc" ] || continue
            gnu_inc="/usr/include/$(basename "$musl_inc" | sed 's/-musl$/-gnu/')"
            sudo rm -rf "$musl_inc/linux" "$musl_inc/asm" "$musl_inc/asm-generic"
            sudo cp -r /usr/include/linux "$musl_inc/linux"
            if [ -d "$gnu_inc/asm" ]; then
              sudo cp -r "$gnu_inc/asm" "$musl_inc/asm"
            fi
            if [ -d /usr/include/asm-generic ]; then
              sudo cp -r /usr/include/asm-generic "$musl_inc/asm-generic"
            fi
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build patched telemt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd telemt
          grep -q user_modes src/config/types.rs
          grep -q socks_user_from_account src/config/types.rs
          grep -q "cfg.general.modes = new.general.modes" src/config/hot_reload.rs
          export RUSTFLAGS="-C target-feature=+crt-static"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          target="${{ matrix.rust_target }}"
          cargo build --release --locked --target "$target"
          cp "target/$target/release/telemt" "../dist/gamaj-telemt-linux-${{ matrix.arch }}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "dist/gamaj-telemt-linux-${{ matrix.arch }}" > \
            "dist/gamaj-telemt-linux-${{ matrix.arch }}.sha256"

      - name: Upload patched telemt artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamaj-telemt-linux-${{ matrix.arch }}
          path: |
            dist/gamaj-telemt-linux-${{ matrix.arch }}
            dist/gamaj-telemt-linux-${{ matrix.arch }}.sha256

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.22"
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_arch: "386"
            goarch: "386"
            goarm: ""
          - asset_arch: amd64
            goarch: amd64
            goarm: ""
          - asset_arch: arm64
            goarch: arm64
            goarm: ""
          - asset_arch: armv5
            goarch: arm
            goarm: "5"
          - asset_arch: armv6
            goarch: arm
            goarm: "6"
          - asset_arch: armv7
            goarch: arm
            goarm: "7"
          - asset_arch: s390x
            goarch: s390x
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            UPLOAD_RELEASE="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            UPLOAD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}"
            RELEASE_TAG=""
            UPLOAD_RELEASE="false"
          else
            REF_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
            VERSION="${REF_SLUG}-${GITHUB_SHA::7}"
            RELEASE_TAG=""
            UPLOAD_RELEASE="false"
          fi

          SHOULD_BUILD="false"
          if [[ "${UPLOAD_RELEASE}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            SHOULD_BUILD="true"
          fi

          ARTIFACT_NAME="gamaj-node-binaries-linux-${{ matrix.asset_arch }}"
          NODE_ASSET_NAME="gamaj-node-${VERSION}-linux-${{ matrix.asset_arch }}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "node_asset_name=${NODE_ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        if: steps.meta.outputs.should_build == 'true'
        env:
          GAMAJ_NODE_GOOS: linux
          GAMAJ_NODE_GOARCH: ${{ matrix.goarch }}
          GAMAJ_NODE_GOARM: ${{ matrix.goarm }}
        run: go run ./tools/build

      - name: Smoke test binary
        if: steps.meta.outputs.should_build == 'true' && matrix.asset_arch == 'amd64'
        run: go run ./tools/smoke

      - name: Prepare artifact
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/gamaj-node "dist/${{ steps.meta.outputs.node_asset_name }}"
          sha256sum "dist/${{ steps.meta.outputs.node_asset_name }}" > "dist/${{ steps.meta.outputs.node_asset_name }}.sha256"

      - name: Upload artifact
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.node_asset_name }}
            dist/${{ steps.meta.outputs.node_asset_name }}.sha256

  build-windows-amd64:
    needs: verify
    runs-on: windows-latest
    env:
      GO_VERSION: "1.22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
            $releaseTag = "${{ github.event.release.tag_name }}"
            $shouldBuild = "true"
          } elseif ("${env:GITHUB_REF_TYPE}" -eq "tag") {
            $version = "${env:GITHUB_REF_NAME}"
            $releaseTag = "${env:GITHUB_REF_NAME}"
            $shouldBuild = "true"
          } elseif ("${{ github.event_name }}" -eq "pull_request") {
            $version = "pr-${{ github.event.pull_request.number }}-$($env:GITHUB_SHA.Substring(0, 7))"
            $releaseTag = ""
            $shouldBuild = "false"
          } else {
            $refSlug = "${env:GITHUB_REF_NAME}" -replace "[/\s]", "-"
            $refSlug = $refSlug -replace "[^A-Za-z0-9._-]", ""
            $version = "$refSlug-$($env:GITHUB_SHA.Substring(0, 7))"
            $releaseTag = ""
            $shouldBuild = "true"
          }

          "artifact_name=gamaj-node-binaries-windows-amd64" >> $env:GITHUB_OUTPUT
          "node_asset_name=gamaj-node-$version-windows-amd64.exe" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "should_build=$shouldBuild" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        if: steps.meta.outputs.should_build == 'true'
        env:
          GAMAJ_NODE_GOOS: windows
          GAMAJ_NODE_GOARCH: amd64
        run: go run ./tools/build

      - name: Smoke test binary
        if: steps.meta.outputs.should_build == 'true'
        run: go run ./tools/smoke

      - name: Prepare artifact
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          Move-Item -LiteralPath dist\gamaj-node.exe -Destination "dist\${{ steps.meta.outputs.node_asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\${{ steps.meta.outputs.node_asset_name }}").Hash.ToLowerInvariant()
          "$hash  ${{ steps.meta.outputs.node_asset_name }}" | Set-Content -NoNewline -Path "dist\${{ steps.meta.outputs.node_asset_name }}.sha256"

      - name: Upload artifact
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.node_asset_name }}
            dist/${{ steps.meta.outputs.node_asset_name }}.sha256

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-extra-vpn-assets
      - build-patched-telemt
      - build-linux
      - build-windows-amd64
    if: github.event_name == 'release' || github.ref_type == 'tag'

    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gamaj-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Gamaj Node ${RELEASE_TAG}"
          gh release delete-asset "${RELEASE_TAG}" gamaj-node -y >/dev/null 2>&1 || true
          gh release upload "${RELEASE_TAG}" release-assets/gamaj-* --clobber

